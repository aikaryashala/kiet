<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selected Teams &middot; KIET Bootcamp 3 &middot; AI Karyashala</title>
<link rel="icon" href="aiklogo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
    :root {
      --cream:      #faf6ef;
      --cream-2:    #f4efe4;
      --paper:      #fffdf8;
      --ink:        #241c15;
      --ink-soft:   #4a3d31;
      --muted:      #7a6a58;
      --rust:       #b8430a;
      --rust-soft:  rgba(184, 67, 10, 0.10);
      --teal:       #1f6f66;
      --teal-soft:  rgba(31, 111, 102, 0.12);
      --gold:       #a97400;
      --gold-soft:  rgba(169, 116, 0, 0.14);
      --line:       rgba(36, 28, 21, 0.13);
      --line-soft:  rgba(36, 28, 21, 0.07);
      --grade:      var(--teal);
      --grade-soft: var(--teal-soft);
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: "Inter Tight", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      position: relative;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: radial-gradient(rgba(36,28,21,0.16) 0.5px, transparent 0.5px);
      background-size: 4px 4px;
      opacity: 0.5;
    }
    .wrap { position: relative; z-index: 1; max-width: 980px; margin: 0 auto; padding: 56px 22px 88px; }

    /* ---------- masthead ---------- */
    .eyebrow {
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.68rem; letter-spacing: 0.20em; text-transform: uppercase; color: var(--muted);
      display: flex; align-items: center; gap: 12px; margin-bottom: 22px;
    }
    .eyebrow::after { content: ""; flex: 1; height: 1px; background: var(--line); }
    .eyebrow a { color: inherit; text-decoration: none; }
    .eyebrow a:hover { color: var(--rust); }
    .grade-mark {
      display: inline-flex; align-items: baseline; gap: 8px;
      font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--grade); background: var(--grade-soft); border: 1px solid var(--grade); border-radius: 2px; padding: 5px 11px; margin-bottom: 18px;
    }
    h1 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: clamp(2.3rem, 6vw, 3.6rem); line-height: 1.06; letter-spacing: -0.015em; margin: 0 0 14px; }
    h1 em { font-style: italic; color: var(--rust); font-weight: 500; }
    .lede { font-size: 1.06rem; color: var(--ink-soft); max-width: 62ch; margin: 0; }
    .lede strong { font-weight: 600; color: var(--ink); }
    .rule { height: 1px; background: var(--line); margin: 40px 0 0; position: relative; }
    .rule::before { content: ""; position: absolute; left: 0; top: -1px; width: 78px; height: 3px; background: var(--rust); }

    /* ---------- stats ---------- */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); margin: 36px 0 12px; }
    .stat { background: var(--cream-2); padding: 18px 20px 20px; }
    .stat .label { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.64rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    .stat .value { font-family: "Fraunces", Georgia, serif; font-size: 2.1rem; font-weight: 600; line-height: 1.1; margin-top: 6px; letter-spacing: -0.02em; }
    .stat.is-done .value { color: var(--teal); }
    .stat.is-open .value { color: var(--rust); }

    /* ---------- toolbar ---------- */
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 26px 0 8px; }
    .search { flex: 1 1 240px; min-width: 0; display: flex; align-items: center; gap: 9px; background: var(--paper); border: 1px solid var(--line); padding: 9px 13px; }
    .search svg { flex: none; opacity: 0.5; }
    .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.85rem; color: var(--ink); }
    .search input::placeholder { color: var(--muted); opacity: 0.75; }
    .toggle {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--ink-soft); background: var(--paper); border: 1px solid var(--line); padding: 10px 14px; cursor: pointer; user-select: none;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .toggle:hover { border-color: var(--rust); }
    .toggle input { accent-color: var(--rust); margin: 0; }
    .toggle.on { background: var(--rust-soft); border-color: var(--rust); color: var(--rust); }
    .count-note { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.72rem; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 26px; }

    /* ---------- team cards ---------- */
    .team { background: var(--paper); border: 1px solid var(--line); margin-bottom: 20px; break-inside: avoid; }
    .team.hidden { display: none; }
    .team.prize-1 { --grade: var(--gold); --grade-soft: var(--gold-soft); }
    .team.prize-2 { --grade: var(--teal); --grade-soft: var(--teal-soft); }
    .team.prize-3 { --grade: var(--rust); --grade-soft: var(--rust-soft); }
    .team.prize-n { --grade: var(--ink-soft); --grade-soft: rgba(36, 28, 21, 0.07); }
    .team.plain { --grade: var(--muted); --grade-soft: transparent; }
    .team.plain .badge { display: none; }
    .team.plain .tally .frac { color: var(--ink-soft); }
    .team .badge {
      align-self: center;
      font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.64rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--grade); background: var(--grade-soft); border: 1px solid var(--grade); border-radius: 2px; padding: 4px 10px; white-space: nowrap;
    }
    .bar i.on { background: var(--grade); }
    .stat.is-win .value { color: var(--gold); }
    .group-head { display: flex; align-items: baseline; gap: 14px; margin: 34px 0 14px; }
    .group-head h2 { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 1.35rem; margin: 0; letter-spacing: -0.01em; }
    .group-head span { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.66rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
    .group-head .line { flex: 1; height: 1px; background: var(--line); }
    .group-head.p1 h2 { color: var(--gold); } .group-head.p2 h2 { color: var(--teal); } .group-head.p3 h2 { color: var(--rust); }
    .group-head.hidden { display: none; }
    .seg { display: inline-flex; border: 1px solid var(--line); background: var(--paper); }
    .seg button {
      font: inherit; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.72rem; letter-spacing: 0.09em; text-transform: uppercase;
      color: var(--ink-soft); background: transparent; border: 0; border-left: 1px solid var(--line); padding: 10px 14px; cursor: pointer;
    }
    .seg button:first-child { border-left: 0; }
    .seg button.on { background: var(--rust-soft); color: var(--rust); }
    .team-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 14px; padding: 18px 22px 16px; background: var(--cream-2); border-bottom: 1px solid var(--line); }
    .num { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.7rem; letter-spacing: 0.1em; color: var(--rust); padding-top: 7px; min-width: 26px; }
    .team-id { flex: 1 1 220px; min-width: 0; }
    .team-name { font-family: "Fraunces", Georgia, serif; font-size: 1.3rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.2; }
    .team-meta { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 5px; }
    .tally { text-align: right; margin-left: auto; }
    .tally .frac { font-family: "Fraunces", Georgia, serif; font-size: 1.25rem; font-weight: 600; color: var(--grade); letter-spacing: -0.01em; }
    .tally .frac span { color: var(--muted); font-weight: 400; }
    .tally .cap { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.6rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-top: 2px; }
    .bar { display: flex; gap: 3px; padding: 0 22px; margin-top: 14px; }
    .bar i { height: 4px; flex: 1; background: var(--line); display: block; }
    .bar i.on { background: var(--teal); }

    table { width: 100%; border-collapse: collapse; }
    thead th { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 400; text-align: left; padding: 14px 22px 10px; border-bottom: 1px solid var(--line); }
    tbody td { padding: 12px 22px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr.miss { background: rgba(184, 67, 10, 0.035); }
    .htno { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.82rem; letter-spacing: 0.02em; color: var(--ink); white-space: nowrap; }
    .sname { font-weight: 500; }
    .lead-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--rust); margin-right: 7px; vertical-align: 2px; }
    .role { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
    .role.leader { color: var(--rust); }
    td.st { text-align: right; white-space: nowrap; }
    .status { display: inline-flex; align-items: center; gap: 6px; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.64rem; letter-spacing: 0.11em; text-transform: uppercase; padding: 4px 10px; border: 1px solid; border-radius: 2px; }
    .status.done { color: var(--teal); border-color: var(--teal); background: var(--teal-soft); }
    .status.miss { color: var(--rust); border-color: var(--rust); background: var(--rust-soft); }

    .empty { display: none; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.8rem; color: var(--muted); border: 1px dashed var(--line); padding: 34px 22px; text-align: center; line-height: 1.9; }
    .empty.show { display: block; }
    .empty code { color: var(--rust); }

    .colophon { margin-top: 44px; padding-top: 20px; border-top: 1px solid var(--line); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.68rem; letter-spacing: 0.08em; color: var(--muted); line-height: 1.9; }
    .colophon a { color: inherit; }
    .people { background: var(--paper); border: 1px solid var(--line); }
    .people tbody td { vertical-align: top; }
    .people .idx { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.7rem; letter-spacing: 0.1em; color: var(--rust); white-space: nowrap; }
    .people .who .sname { display: block; }
    .people .who .meta { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
    .people .team-cell { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.8rem; white-space: nowrap; }
    .people .note-cell { color: var(--ink-soft); font-size: 0.95rem; }
    .people tr.unknown td { background: rgba(184, 67, 10, 0.035); }
    .people tr.hidden { display: none; }
    @media (max-width: 640px) { .people thead th:nth-child(3), .people tbody td:nth-child(3) { display: none; } }

    @media (max-width: 640px) {
      .wrap { padding: 36px 16px 64px; }
      thead th:nth-child(3), tbody td:nth-child(3) { display: none; }
      thead th, tbody td { padding-left: 16px; padding-right: 16px; }
      .team-head { padding: 16px; }
      .bar { padding: 0 16px; }
      .tally { text-align: left; margin-left: 0; }
    }
    @media print {
      body { background: #fff; }
      body::before { display: none; }
      .toolbar, .count-note { display: none !important; }
      .team, .team.hidden { display: block !important; break-inside: avoid; }
      .wrap { max-width: none; padding: 0; }
      .team { border-color: #bbb; }
    }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow"><a href="index.html">AI Karyashala &nbsp;/&nbsp; KIET Bootcamp 3</a> &nbsp;/&nbsp; <a href="results.html">Results</a> &nbsp;/&nbsp; Selected teams</div>

    <div class="grade-mark">Selected teams</div>
    <h1>Selected <em>Teams</em></h1>
    <p class="lede">The teams shortlisted from Day 1. They present what they built on Day 2, after the Omarchy session.</p>
    <div class="rule"></div>

    <section class="stats">
      <div class="stat is-done"><div class="label">Selected</div><div class="value" id="st-sel">–</div></div>
      <div class="stat"><div class="label">Of all teams</div><div class="value" id="st-of">–</div></div>
      <div class="stat"><div class="label">Students presenting</div><div class="value" id="st-people">–</div></div>
    </section>

    <div class="toolbar">
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search team, roll number or name&hellip;" autocomplete="off">
      </div>
    </div>
    <p class="count-note" id="note">Loading selected-teams.csv and participants.csv&hellip;</p>

    <div id="teams"></div>
    <div class="empty" id="empty"></div>

  </div>

<script>
(function () {
  var box = document.getElementById('q');
  var note = document.getElementById('note');
  var empty = document.getElementById('empty');
  var host = document.getElementById('teams');

  function parseCSV(text) {
    var rows = [], row = [], field = '', q = false, i, c;
    for (i = 0; i < text.length; i++) {
      c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else { q = false; } }
        else field += c;
      } else if (c === '"') { q = true; }
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); field = '';
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (ch) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]; }); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function key(s) { return String(s || '').trim().toUpperCase(); }
  function norm(h) { return h.trim().toLowerCase().replace(/[\s_]+/g, ''); }
  function fail(msg) { note.textContent = ''; empty.innerHTML = msg; empty.classList.add('show'); }
  function load(name) {
    return fetch(name, { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error(name + ': ' + res.status + ' ' + res.statusText);
      return res.text().then(function (t) { return { rows: parseCSV(t) }; });
    });
  }

  Promise.all([load('selected-teams.csv'), load('participants.csv')]).then(function (r) { render(r[0], r[1]); })
    .catch(function (err) { fail('Could not load the files (' + esc(err.message) + '). Both must sit next to this page and be served over http; opening the page as a file will not work.'); });

  function render(sel, part) {
    // ---- participants: team -> members ----
    var prow = part.rows.slice(), ph = prow.shift().map(norm);
    var pc = function () { for (var i = 0; i < arguments.length; i++) { var k = ph.indexOf(arguments[i]); if (k >= 0) return k; } return -1; };
    var iH = pc('htno', 'rollno', 'roll'), iName = pc('studentname', 'name'), iTeam = pc('teamname', 'team'), iSec = pc('classid', 'section', 'class'),
        iProg = pc('program', 'programme', 'branch'), iRole = pc('role');
    if (iH < 0 || iName < 0 || iTeam < 0) return fail('participants.csv needs at least the columns <code>HTNO, Student Name, Team Name</code>.');
    var teams = {}, order = [];
    prow.forEach(function (r) {
      var get = function (i) { return i >= 0 ? (r[i] || '').trim() : ''; };
      var t = get(iTeam); if (!t) return;
      var k = key(t);
      if (!teams[k]) { teams[k] = { name: t, members: [] }; order.push(k); }
      teams[k].members.push({ htno: get(iH), name: get(iName), section: get(iSec), program: get(iProg), role: get(iRole) });
    });
    Object.keys(teams).forEach(function (k) {
      teams[k].members.sort(function (a, b) { var la = /lead/i.test(a.role), lb = /lead/i.test(b.role); return la === lb ? a.htno.localeCompare(b.htno) : (la ? -1 : 1); });
    });

    // ---- selected-teams: team (+ note) ----
    var srow = sel.rows.slice(), sh = srow.shift().map(norm);
    var sT = sh.indexOf('team'); if (sT < 0) sT = sh.indexOf('teamname'); if (sT < 0) sT = 0;
    var sN = sh.indexOf('note'); if (sN < 0) sN = sh.indexOf('reason'); if (sN < 0) sN = sh.indexOf('remark');
    var list = [], seen = {}, people = 0, unknown = 0;
    srow.forEach(function (r) {
      var k = key(r[sT]); if (!k || seen[k]) return;
      seen[k] = true;
      var t = teams[k];
      var entry = t ? { name: t.name, members: t.members, known: true } : { name: (r[sT] || '').trim(), members: [], known: false };
      entry.note = sN >= 0 ? (r[sN] || '').trim() : '';
      if (t) people += t.members.length; else unknown++;
      list.push(entry);
    });

    document.getElementById('st-sel').textContent = list.length;
    document.getElementById('st-of').textContent = order.length;
    document.getElementById('st-people').textContent = people;

    var html = '';
    list.forEach(function (t, i) {
      var find = [t.name, t.note].concat(t.members.map(function (m) { return m.htno + ' ' + m.name; })).join(' ').toLowerCase();
      html += '<section class="team' + (t.known ? '' : ' plain') + '" data-find="' + esc(find) + '">' +
        '<div class="team-head"><div class="num">' + pad(i + 1) + '</div>' +
        '<div class="team-id"><div class="team-name">' + esc(t.name) + '</div>' +
        '<div class="team-meta">' + (t.known ? t.members.length + ' member' + (t.members.length === 1 ? '' : 's') : 'not in participants.csv') + (t.note ? ' &middot; ' + esc(t.note) : '') + '</div></div>' +
        '<div class="badge">Selected</div></div>';
      if (t.members.length) {
        html += '<table><thead><tr><th>Roll number</th><th>Student</th><th>Class &middot; Program</th><th style="text-align:right">Role</th></tr></thead><tbody>';
        t.members.forEach(function (m) {
          var lead = /lead/i.test(m.role);
          html += '<tr><td class="htno">' + esc(m.htno) + '</td>' +
            '<td class="sname">' + (lead ? '<span class="lead-dot"></span>' : '') + esc(m.name) + '</td>' +
            '<td class="role">' + esc([m.section, m.program].filter(function (x) { return x; }).join(' · ')) + '</td>' +
            '<td class="st"><span class="role' + (lead ? ' leader' : '') + '">' + esc(m.role || 'member') + '</span></td></tr>';
        });
        html += '</tbody></table>';
      }
      html += '</section>';
    });
    if (unknown) html += '<p class="count-note">' + unknown + ' team name' + (unknown === 1 ? '' : 's') + ' in selected-teams.csv not found in participants.csv (shown without members).</p>';
    host.innerHTML = html;

    var cards = Array.prototype.slice.call(host.querySelectorAll('.team'));
    function apply() {
      var q = (box.value || '').trim().toLowerCase(), shown = 0;
      cards.forEach(function (c) { var ok = !q || c.getAttribute('data-find').indexOf(q) !== -1; c.classList.toggle('hidden', !ok); if (ok) shown++; });
      note.textContent = shown + ' team' + (shown === 1 ? '' : 's') + ' shown';
      empty.textContent = 'No match.';
      empty.classList.toggle('show', shown === 0);
    }
    box.addEventListener('input', apply);
    apply();
  }
})();
</script>
</body>
</html>
